name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # arm64
            exe: walk_detection_rust
          - os: windows-latest
            exe: walk_detection_rust.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release

      # 実行ファイルの隣に data/config.json を置く
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/WalkDetection/data
          cp target/release/${{ matrix.exe }} dist/WalkDetection/
          cp data/config.json dist/WalkDetection/data/

      # artifact の zip では実行権限が落ちるので、macOS は tar にしてから上げる
      - if: runner.os == 'macOS'
        run: tar -czf dist/WalkDetection.tar.gz -C dist WalkDetection

      - uses: actions/upload-artifact@v7
        with:
          name: WalkDetection-${{ runner.os }}
          path: ${{ runner.os == 'macOS' && 'dist/WalkDetection.tar.gz' || 'dist/WalkDetection' }}
